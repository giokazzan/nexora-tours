<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mi Reserva — Nexora</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<style>
:root{--navy:#071a26;--navy-mid:#0d2d3f;--teal:#0b9e99;--teal-light:#3ecfc4;--gold:#f5c842;--white:#fff;--gray:#8ab2b0;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Barlow',Arial,sans-serif;background:var(--navy);color:var(--white);min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:60px 20px;}
.logo{font-family:'Bebas Neue',Arial,sans-serif;font-size:26px;letter-spacing:1px;margin-bottom:6px;}
.logo span{color:var(--gold);}
.tagline{font-size:11px;letter-spacing:.2em;color:var(--gray);text-transform:uppercase;margin-bottom:40px;}

.card{background:var(--navy-mid);border:1px solid rgba(11,158,153,0.25);border-radius:16px;padding:32px;max-width:440px;width:100%;}
h1{font-family:'Bebas Neue',Arial,sans-serif;font-size:28px;margin-bottom:8px;}
p.sub{color:var(--gray);font-size:.88rem;margin-bottom:24px;line-height:1.5;}

.form-group input{width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.15);border-radius:8px;padding:13px 16px;color:var(--white);font-size:16px;font-family:inherit;text-transform:uppercase;letter-spacing:1px;text-align:center;}
.form-group input::placeholder{text-transform:none;letter-spacing:normal;color:#5a7a86;}
.btn{width:100%;background:var(--teal);color:#fff;border:none;border-radius:8px;padding:14px;font-weight:700;font-size:14px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;margin-top:14px;}
.btn:disabled{opacity:.6;cursor:default;}
.err{color:#ff6b6b;font-size:13px;margin-top:12px;text-align:center;}

.resultado{margin-top:24px;}
.badge{display:inline-block;padding:5px 14px;border-radius:20px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
.badge.pendiente{background:rgba(245,200,66,0.15);color:var(--gold);border:1px solid rgba(245,200,66,0.4);}
.badge.confirmada{background:rgba(93,207,142,0.15);color:#5dcf8e;border:1px solid rgba(93,207,142,0.4);}
.badge.rechazada{background:rgba(255,107,107,0.15);color:#ff6b6b;border:1px solid rgba(255,107,107,0.4);}

.res-titulo{font-family:'Bebas Neue',Arial,sans-serif;font-size:22px;margin:14px 0 4px;}
.res-linea{display:flex;justify-content:space-between;font-size:.85rem;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.06);}
.res-linea span:first-child{color:var(--gray);}

.mensaje-estado{margin-top:18px;padding:14px;border-radius:10px;font-size:.85rem;line-height:1.5;}
.mensaje-estado.pendiente{background:rgba(245,200,66,0.08);border:1px solid rgba(245,200,66,0.25);color:#f5c842;}
.mensaje-estado.confirmada{background:rgba(93,207,142,0.08);border:1px solid rgba(93,207,142,0.25);color:#5dcf8e;}
.mensaje-estado.rechazada{background:rgba(255,107,107,0.08);border:1px solid rgba(255,107,107,0.25);color:#ff9b9b;}

.soporte{margin-top:20px;text-align:center;font-size:.78rem;color:var(--gray);}
.soporte a{color:var(--teal-light);font-weight:600;text-decoration:none;}

.topnav{position:fixed;top:20px;left:20px;}
.topnav a{color:var(--gray);font-size:.82rem;text-decoration:none;}
.topnav a:hover{color:var(--teal-light);}

/* ── Pase de abordar de hotel ── */
.hpase{background:#fff;color:#161514;border-radius:14px;overflow:hidden;margin-top:20px;}
.hpase-top{padding:20px 22px 16px;}
.hpase-hotel{font-family:'Bebas Neue',Arial,sans-serif;font-size:22px;line-height:1.15;}
.hpase-badge{display:inline-block;margin-top:6px;padding:4px 12px;border-radius:20px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;background:rgba(93,207,142,.12);color:#2e8b57;}
.hpase-ruta{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;background:#faf9f5;}
.hpase-punto .lbl{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#8a8580;}
.hpase-punto .val{font-family:'Bebas Neue',Arial,sans-serif;font-size:19px;color:#161514;}
.hpase-punto.der{text-align:right;}
.hpase-perf{height:0;border-top:2px dashed #d8d3c5;margin:0 20px;position:relative;}
.hpase-perf::before,.hpase-perf::after{content:'';position:absolute;top:-10px;width:20px;height:20px;border-radius:50%;background:var(--navy-mid);}
.hpase-perf::before{left:-30px;}
.hpase-perf::after{right:-30px;}
.hpase-detalles{padding:18px 22px;display:grid;grid-template-columns:1fr 1fr;gap:14px 10px;}
.hpase-campo .lbl{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#8a8580;margin-bottom:2px;}
.hpase-campo .val{font-size:13.5px;font-weight:600;}
.hpase-campo.full{grid-column:1/-1;}
.hpase-pago{background:#0a1420;color:#fff;padding:18px 22px;}
.hpase-pago .fila{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;}
.hpase-pago .fila span:first-child{color:#8a93a8;}
.hpase-pago .fila.saldo strong{color:#f5c842;}

.abono-toggle{width:100%;background:transparent;border:1.5px solid var(--teal-light);color:var(--teal-light);border-radius:8px;padding:12px;font-weight:700;font-size:13px;cursor:pointer;margin-top:16px;}
.abono-form{margin-top:14px;text-align:left;}
.abono-form label{display:block;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--gray);margin-bottom:5px;margin-top:12px;}
.abono-form input[type="number"],.abono-form input[type="file"]{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:11px 14px;color:#fff;font-size:15px;font-family:inherit;}
.transfer-box{background:rgba(255,255,255,.03);border:1px dashed rgba(11,158,153,.4);border-radius:8px;padding:14px;font-size:12.5px;line-height:1.9;margin-top:12px;}
.transfer-box .r{display:flex;justify-content:space-between;}
.transfer-box .r span:first-child{color:var(--gray);}
.transfer-box .r strong{color:var(--teal-light);}
</style>
</head>
<body>

<div class="topnav"><a href="https://www.nexora-travel.com/">← Volver al sitio</a></div>
<div class="logo">N<span>EX</span>ORA</div>
<div class="tagline">Privileged Access</div>

<div class="card">
  <h1>¿Cómo va tu reserva?</h1>
  <p class="sub">Escribe tu apellido y el folio que te dimos al confirmar tu reserva de tour o vehículo.</p>

  <div class="form-group" style="margin-bottom:12px">
    <input type="text" id="f-apellido" placeholder="Tu apellido" onkeydown="if(event.key==='Enter')buscarReserva()">
  </div>
  <div class="form-group">
    <input type="text" id="f-folio" placeholder="Ej: TUR-ABC123 · VEH-ABC123 · TRL-ABC123 · NXR-0000-XXX-X" onkeydown="if(event.key==='Enter')buscarReserva()">
  </div>
  <button class="btn" id="btn-buscar" onclick="buscarReserva()">Buscar mi reserva</button>
  <div class="err" id="err-msg"></div>

  <div class="resultado" id="resultado" style="display:none"></div>
</div>

<div class="soporte">¿No encuentras tu folio? <a href="https://wa.me/529982168410?text=Hola%2C%20necesito%20ayuda%20para%20encontrar%20mi%20folio%20de%20reserva">Escríbenos por WhatsApp</a></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAJR13NWfWBURGZZtUhzA0OVjm3nSxCR28",
  authDomain: "nexora-club.firebaseapp.com",
  projectId: "nexora-club",
  storageBucket: "nexora-club.firebasestorage.app",
  messagingSenderId: "651071612444",
  appId: "1:651071612444:web:86bb7b36b1446220e661d9"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function fmt(n) { return (n || 0).toLocaleString('es-MX'); }

const MENSAJES = {
  pendiente: '⏳ Estamos validando tu comprobante. Normalmente tarda hasta 3 horas — si ya pasó ese tiempo, escríbenos por WhatsApp.',
  confirmada: '✅ ¡Tu reserva está confirmada! Nos vemos pronto.',
  rechazada: '⚠️ Hubo un problema validando tu comprobante. Escríbenos por WhatsApp para resolverlo.',
};

const folioURL = new URLSearchParams(window.location.search).get('folio');
if (folioURL) {
  document.getElementById('f-folio').value = folioURL;
  setTimeout(() => window.buscarReserva(), 100);
}

function normalizar(txt) {
  return (txt || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
}

window.buscarReserva = async () => {
  const folioInput = document.getElementById('f-folio');
  const apellidoInput = document.getElementById('f-apellido');
  const folio = folioInput.value.trim().toUpperCase().replace(/[^A-Z0-9\-]/g, '');
  const apellido = normalizar(apellidoInput.value);
  const errEl = document.getElementById('err-msg');
  const resultadoEl = document.getElementById('resultado');
  const btn = document.getElementById('btn-buscar');
  errEl.textContent = '';
  resultadoEl.style.display = 'none';

  if (!apellido) { errEl.textContent = 'Escribe tu apellido antes de buscar.'; return; }
  if (!folio) { errEl.textContent = 'Escribe tu folio antes de buscar.'; return; }

  btn.disabled = true; btn.textContent = 'Buscando...';
  try {
    const indexSnap = await getDoc(doc(db, 'reservas_index', folio));
    if (!indexSnap.exists()) {
      errEl.textContent = 'No encontramos una reserva con esos datos. Revisa que el folio y el apellido estén bien escritos.';
      return;
    }
    const { coleccion, docId } = indexSnap.data();
    const resSnap = await getDoc(doc(db, coleccion, docId));
    if (!resSnap.exists()) {
      errEl.textContent = 'No pudimos encontrar los detalles de esta reserva. Contáctanos por WhatsApp.';
      return;
    }

    const r = resSnap.data();

    // Verificación estilo Volaris: el apellido (o nombre+apellido) debe aparecer dentro del nombre registrado
    const nombreGuardado = normalizar(r.nombre);
    if (!nombreGuardado.includes(apellido)) {
      errEl.textContent = 'No encontramos una reserva con esos datos. Revisa que el folio y el apellido estén bien escritos.';
      return;
    }

    const esTour = coleccion === 'nexora_tours_reservas';
    const esVehiculo = coleccion === 'nexora_vehiculos_reservas';
    const esTraslado = coleccion === 'nexora_traslados_reservas';
    const esHotel = coleccion === 'nexora_hoteles_reservas';

    if (esHotel) {
      renderPaseHotel(r, folio, docId);
      resultadoEl.style.display = 'block';
      return;
    }

    let nombreProducto, fechaTexto, totalTexto, icono;
    if (esTour) {
      nombreProducto = r.tourNombre; fechaTexto = r.fecha; totalTexto = r.totalMXN; icono = '🌴';
    } else if (esVehiculo) {
      nombreProducto = r.vehiculoNombre; fechaTexto = `${r.fechaInicio} → ${r.fechaFin}`; totalTexto = r.totalEstimado; icono = '🚗';
    } else {
      nombreProducto = r.trasladoNombre + (r.redondo ? ' (redondo)' : '');
      const d = r.datosViaje || {};
      fechaTexto = d.tipo === 'llegada' ? `${d.fecha} · ${d.hora}` : `${d.fechaVuelo} · ${d.horaVuelo}`;
      totalTexto = r.totalMXN; icono = '🚐';
    }
    const estado = r.estado || 'pendiente';

    resultadoEl.innerHTML = `
      <span class="badge ${estado}">${estado}</span>
      <div class="res-titulo">${icono} ${nombreProducto}</div>
      <div class="res-linea"><span>Folio</span><strong>${folio}</strong></div>
      <div class="res-linea"><span>Fecha</span><strong>${fechaTexto}</strong></div>
      <div class="res-linea"><span>Total</span><strong>$${fmt(totalTexto)} MXN</strong></div>
      <div class="res-linea"><span>Anticipo</span><strong>$${fmt(r.deposito)} MXN</strong></div>
      <div class="mensaje-estado ${estado}">${MENSAJES[estado] || ''}</div>
    `;
    resultadoEl.style.display = 'block';
  } catch (e) {
    errEl.textContent = 'Ocurrió un error buscando tu reserva. Intenta de nuevo en un momento.';
  } finally {
    btn.disabled = false; btn.textContent = 'Buscar mi reserva';
  }
};

function renderPaseHotel(r, folio, docId) {
  const resultadoEl = document.getElementById('resultado');
  const saldo = r.saldo || 0;
  resultadoEl.innerHTML = `
    <div class="hpase">
      <div class="hpase-top">
        <div class="hpase-hotel">🏨 ${r.hotel || ''}</div>
        <span class="hpase-badge">Reserva confirmada</span>
      </div>
      <div class="hpase-ruta">
        <div class="hpase-punto"><div class="lbl">Check-in</div><div class="val">${r.checkIn || '—'}</div></div>
        <div style="color:#c9a84c;font-size:18px">→</div>
        <div class="hpase-punto der"><div class="lbl">Check-out</div><div class="val">${r.checkOut || '—'}</div></div>
      </div>
      <div class="hpase-perf"></div>
      <div class="hpase-detalles">
        <div class="hpase-campo full"><div class="lbl">Titular</div><div class="val">${r.cliente || ''}</div></div>
        <div class="hpase-campo"><div class="lbl">Habitación</div><div class="val">${r.habitacion || '—'}</div></div>
        <div class="hpase-campo"><div class="lbl">Huéspedes</div><div class="val">${r.adultos||1} adulto(s)${r.menores?', '+r.menores+' menor(es)':''}</div></div>
        <div class="hpase-campo full"><div class="lbl">Folio</div><div class="val">${folio}</div></div>
      </div>
      <div class="hpase-pago">
        <div class="fila"><span>Total</span><strong>$${fmt(r.total)} ${r.moneda||'MXN'}</strong></div>
        <div class="fila"><span>Pagado</span><strong>$${fmt(r.anticipo)} ${r.moneda||'MXN'}</strong></div>
        <div class="fila saldo"><span>Saldo pendiente</span><strong>$${fmt(saldo)} ${r.moneda||'MXN'}</strong></div>
        ${r.fechaLimite ? `<div class="fila"><span>Fecha límite</span><strong>${r.fechaLimite}</strong></div>` : ''}
      </div>
    </div>
  `;

  if (saldo > 0) {
    resultadoEl.innerHTML += `
      <button class="abono-toggle" id="btn-abono-toggle" onclick="mostrarFormAbono('${docId}', ${saldo})">💳 Hacer un abono</button>
      <div id="abono-form-wrap"></div>
    `;
  }
}

window.mostrarFormAbono = (docId, saldoMax) => {
  document.getElementById('btn-abono-toggle').style.display = 'none';
  document.getElementById('abono-form-wrap').innerHTML = `
    <div class="abono-form">
      <label>¿Cuánto quieres abonar? (máximo $${fmt(saldoMax)})</label>
      <input type="number" id="ab-monto" max="${saldoMax}" min="1" placeholder="Ej: 5000">
      <div class="transfer-box">
        <div class="r"><span>Institución</span><strong>BBVA</strong></div>
        <div class="r"><span>Beneficiario</span><strong>Membresía Nexora</strong></div>
        <div class="r"><span>Tarjeta</span><strong>4152 3141 9214 8651</strong></div>
      </div>
      <label>Comprobante de transferencia</label>
      <input type="file" id="ab-comprobante" accept="image/*,.pdf">
      <button class="btn" id="ab-submit-btn" style="margin-top:16px" onclick="enviarAbono('${docId}', ${saldoMax})">Enviar abono</button>
      <div class="err" id="ab-err"></div>
    </div>
  `;
};

function comprimirImagenAbono(file) {
  return new Promise((resolve) => {
    if (!file.type.startsWith('image/') || file.size <= 1.8 * 1024 * 1024) { resolve(file); return; }
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const MAX = 2200; let { width, height } = img;
      if (width > height && width > MAX) { height = height * (MAX / width); width = MAX; }
      else if (height > MAX) { width = width * (MAX / height); height = MAX; }
      const canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      canvas.toBlob((blob) => {
        if (!blob) { resolve(file); return; }
        resolve(new File([blob], file.name.replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' }));
      }, 'image/jpeg', 0.85);
    };
    img.onerror = () => resolve(file);
    img.src = url;
  });
}
function fileToBase64Abono(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

window.enviarAbono = async (docId, saldoMax) => {
  const monto = parseFloat(document.getElementById('ab-monto').value);
  const file = document.getElementById('ab-comprobante').files[0];
  const errEl = document.getElementById('ab-err');
  const btn = document.getElementById('ab-submit-btn');
  errEl.textContent = '';

  if (!monto || monto <= 0) { errEl.textContent = 'Ingresa un monto válido.'; return; }
  if (monto > saldoMax) { errEl.textContent = `El máximo a abonar es $${fmt(saldoMax)}.`; return; }
  if (!file) { errEl.textContent = 'Sube tu comprobante de transferencia.'; return; }

  btn.disabled = true; btn.textContent = 'Subiendo...';
  try {
    const comprimido = await comprimirImagenAbono(file);
    const base64 = await fileToBase64Abono(comprimido);
    const folioTmp = 'ABN-' + Date.now().toString(36).toUpperCase();

    const respSubida = await fetch('/api/subir-comprobante', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ folio: folioTmp, nombreArchivo: comprimido.name, contentType: comprimido.type, base64 }),
    });
    const resultSubida = await respSubida.json();
    if (!resultSubida.success) throw new Error(resultSubida.error || 'No se pudo subir el comprobante.');

    await updateDoc(doc(db, 'nexora_hoteles_reservas', docId), {
      abonosPendientes: arrayUnion({
        monto, comprobanteUrl: resultSubida.url, fecha: new Date().toISOString(), estado: 'pendiente',
      }),
    });

    document.getElementById('abono-form-wrap').innerHTML = `
      <div class="mensaje-estado pendiente" style="margin-top:14px">⏳ Tu abono de $${fmt(monto)} fue recibido y será revisado en un máximo de 3 horas. El saldo se actualizará en cuanto se confirme.</div>
    `;
  } catch (e) {
    errEl.textContent = e.message || 'Ocurrió un error, intenta de nuevo.';
    btn.disabled = false; btn.textContent = 'Enviar abono';
  }
};
</script>
<div style="position:fixed;bottom:4px;left:0;right:0;text-align:center;font-family:'Barlow',sans-serif;font-size:.6rem;letter-spacing:.08em;color:rgba(240,237,232,.15);pointer-events:none;z-index:9998">Build by Ormuz</div>
</body>
</html>
